
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Avadh Fleet Service - Commercial Billing & Dispatch Tool</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root {
  --bg: #f8fafc;
  --card: #ffffff;
  --border: #e2e8f0;
  --text-main: #0f172a;
  --text-muted: #64748b;
  --primary: #0f172a;
  --primary-light: #1e293b;
  --green: #10b981;
  --red: #f43f5e;
  --blue: #3b82f6;
  --whatsapp: #25d366;
  --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05), 0 4px 12px -5px rgba(0, 0, 0, 0.03);
}

[data-theme="dark"] {
  --bg: #090d16;
  --card: #111827;
  --border: #1f2937;
  --text-main: #f9fafb;
  --text-muted: #9ca3af;
  --primary: #f9fafb;
  --primary-light: #f3f4f6;
  --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.3);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  transition: background-color 0.2s, border-color 0.2s;
}

body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: var(--bg);
  color: var(--text-main);
  padding-bottom: 60px;
}

header {
  background: linear-gradient(135deg, #0f172a, #1e293b);
  color: #fff;
  padding: 24px;
  text-align: center;
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.5px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  max-width: 1450px;
  margin: 20px auto 0 auto;
  border-radius: 16px;
  box-shadow: var(--shadow);
}

.theme-toggle {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: white;
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
}

.theme-toggle:hover {
  background: rgba(255, 255, 255, 0.2);
}

.container {
  max-width: 1450px;
  margin: auto;
  padding: 20px 0;
  display: grid;
  grid-template-columns: 440px 1fr;
  gap: 24px;
}

.left-panel, .right-panel {
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  box-shadow: var(--shadow);
}

.card h3 {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 20px;
  color: var(--text-main);
  display: flex;
  align-items: center;
  gap: 8px;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.full-width {
  grid-column: span 2;
}

label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-muted);
  margin-bottom: 8px;
  display: block;
}

input, select {
  width: 100%;
  padding: 12px 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text-main);
  font-size: 14px;
  font-weight: 500;
  outline: none;
}

input:focus, select:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
}

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
}

.kpi {
  border-radius: 16px;
  padding: 20px;
  color: #fff;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 110px;
  box-shadow: var(--shadow);
}

.kpi h4 {
  font-size: 13px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  opacity: 0.9;
}

.kpi .value {
  font-size: 26px;
  font-weight: 700;
  margin-top: 8px;
}

.kpi.dark { background: linear-gradient(135deg, #1e293b, #0f172a); }
.kpi.blue { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
.kpi.green { background: linear-gradient(135deg, #10b981, #047857); }
.kpi.red { background: linear-gradient(135deg, #f43f5e, #be123c); }

.big-total {
  background: linear-gradient(135deg, #0f172a, #1e293b);
  color: #fff;
  border-radius: 16px;
  padding: 30px;
  text-align: center;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}

[data-theme="dark"] .big-total {
  background: linear-gradient(135deg, #1f2937, #111827);
  border: 1px solid var(--border);
}

.big-total h2 {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 1px;
  margin-bottom: 8px;
  opacity: 0.8;
}

.big-total .amount {
  font-size: 46px;
  font-weight: 800;
  color: #10b981;
}

.result-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
}

.result-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 0;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
}

.result-item:last-child {
  border-bottom: none;
}

.result-item span {
  color: var(--text-muted);
  font-weight: 500;
}

.result-item b {
  color: var(--text-main);
  font-weight: 600;
}

.action-block {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.btn {
  color: white;
  border: none;
  padding: 16px;
  border-radius: 12px;
  cursor: pointer;
  font-weight: 700;
  font-size: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  box-shadow: var(--shadow);
}

.btn-print { background: var(--primary); color: var(--bg); border: 1px solid var(--border); }
.btn-whatsapp { background: var(--whatsapp); }
.btn:hover { opacity: 0.95; transform: translateY(-1px); }

.chart-box {
  height: 320px;
  position: relative;
}

/* HIGH POLISH NATIVE PRINT WRAPPER FOR PDF GENERATION */
@media print {
  @page {
    size: A4 portrait;
    margin: 20mm 15mm;
  }
  
  body {
    background: #ffffff !important;
    color: #000000 !important;
    font-size: 12pt;
    padding: 0;
  }

  header, .left-panel, .theme-toggle, .action-block, .chart-box, .kpi-grid, #profitChart {
    display: none !important;
  }

  .container {
    display: block !important;
    width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  .right-panel {
    width: 100% !important;
    display: block !important;
  }

  .big-total {
    border: 2px solid #000000 !important;
    background: #f8fafc !important;
    color: #000000 !important;
    margin-bottom: 30px !important;
    border-radius: 8px !important;
    padding: 20px !important;
    page-break-inside: avoid;
  }

  .big-total .amount {
    color: #000000 !important;
    font-size: 32pt !important;
  }

  .result-grid {
    display: block !important;
  }

  .card {
    border: none !important;
    box-shadow: none !important;
    padding: 0 !important;
    margin-bottom: 40px !important;
    page-break-inside: avoid;
  }

  .card h3 {
    font-size: 14pt !important;
    border-bottom: 2px solid #0f172a !important;
    padding-bottom: 6px !important;
    color: #0f172a !important;
    text-transform: uppercase;
  }

  .result-item {
    border-bottom: 1px dashed #94a3b8 !important;
    padding: 10px 0 !important;
  }

  .result-item span {
    color: #1e293b !important;
  }

  .result-item b {
    color: #000000 !important;
  }
}
</style>
</head>

<body>

<header>
  <span>🚚 Avadh Fleet Service</span>
  <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()">🌙 Dark Mode</button>
</header>

<div class="container">

  <div class="left-panel">
    <div class="card">
      <h3>📋 Trip Profile</h3>
      <div class="grid">
        <div>
          <label>Trip Assignment</label>
          <select id="tripType">
            <option value="LOCAL">LOCAL</option>
            <option value="OUTSIDE">OUTSIDE</option>
          </select>
        </div>
        <div>
          <label>Truck Type</label>
          <select id="truckType">
            <option value="BOLERO">BOLERO PICKUP</option>
            <option value="1059">EICHER 1059</option>
            <option value="2059">EICHER 2059</option>
            <option value="2095">EICHER 2095</option>
            <option value="2010">EICHER 2010</option>
            <option value="2118">EICHER 2118</option>
          </select>
        </div>
        <div>
          <label>Deck Size</label>
          <select id="truckSize"></select>
        </div>
        <div>
          <label>Logistics Distance (KM)</label>
          <input type="number" id="distance" value="100" min="0">
        </div>
        <div>
          <label>Payload Weight (TON)</label>
          <input type="number" id="weight" readonly>
        </div>
        <div>
          <label>Terminal Diesel Price</label>
          <input type="number" id="dieselPrice" value="94.54" step="0.01">
        </div>
        <div>
          <label>Drop Points</label>
          <input type="number" id="deliveries" value="0" min="0">
        </div>
        <div class="full-width">
          <label>Return Leg Arrangement</label>
          <select id="returnLoad">
            <option value="NO">No Return Load (Empty Return)</option>
            <option value="YES">Guaranteed Return Load (Shared Backhaul)</option>
          </select>
        </div>
      </div>
    </div>

    <div class="card">
      <h3>👨‍✈️ Driver Schedule</h3>
      <div class="grid">
        <div>
          <label>Billing Cycle Unit</label>
          <select id="timeType">
            <option value="HOUR">HOURLY BASIS</option>
            <option value="DAY">DAILY BASIS</option>
          </select>
        </div>
        <div>
          <label>Cycle Duration</label>
          <input type="number" id="timeValue" value="1" min="1">
        </div>
      </div>
    </div>

    <div class="card">
      <h3>📑 Regulatory Permits</h3>
      <div class="grid">
        <div>
          <label>State Permit Scope</label>
          <select id="permitCheck">
            <option value="NO">Standard Route</option>
            <option value="YES">Cross Border Permit</option>
          </select>
        </div>
        <div>
          <label>Permit Cost Clearance</label>
          <input type="number" id="permitCost" value="0" min="0">
        </div>
      </div>
    </div>

    <div class="action-block">
      <button class="btn btn-print" onclick="window.print()">
        🖨 Save As PDF
      </button>
      <button class="btn btn-whatsapp" onclick="exportToWhatsApp()">
        💬 Share Quote
      </button>
    </div>
  </div>

  <div class="right-panel">
    <div class="kpi-grid">
      <div class="kpi dark">
        <h4>Gross Expenses</h4>
        <div class="value" id="kpiCost">₹0</div>
      </div>
      <div class="kpi blue">
        <h4>Base Freight</h4>
        <div class="value" id="kpiFreight">₹0</div>
      </div>
      <div class="kpi green" id="profitKpi">
        <h4>Net Margin Yield</h4>
        <div class="value" id="kpiProfit">₹0</div>
      </div>
      <div class="kpi green" id="marginKpi">
        <h4>Margin Ratio</h4>
        <div class="value" id="kpiMargin">0%</div>
      </div>
    </div>

    <div class="big-total">
      <h2>RECOMMENDED FREIGHT QUOTATION RATE</h2>
      <div class="amount" id="finalFreight">₹0</div>
    </div>

    <div class="result-grid">
      <div class="card">
        <h3>📊 Opex Ledger Elements</h3>
        <div id="costBreakdown"></div>
      </div>
      <div class="card">
        <h3>📈 Yield Efficiency Index</h3>
        <div id="freightAnalysis"></div>
      </div>
    </div>

    <div class="card">
      <h3>⚖️ Yield Distribution Metrics</h3>
      <div class="chart-box">
        <canvas id="profitChart"></canvas>
      </div>
    </div>
  </div>

</div>

<script>
let chart;
let currentCalculatedData = {}; // Global layout holder to assist share string generation

const truckDatabase = {
BOLERO:{weight:2,decks:[9]},
"1059":{weight:3.5,decks:[14]},
"2059":{weight:5,decks:[17]},
"2095":{weight:7,decks:[17,20,22]},
"2010":{weight:10,decks:[20,22]},
"2118":{weight:12,decks:[20,22]}
};

const fuelConsumption = {
BOLERO:{LOCAL:11,OUTSIDE:13},
"1059":{LOCAL:10,OUTSIDE:11},
"2059":{LOCAL:8,OUTSIDE:10},
"2095":{LOCAL:6,OUTSIDE:8},
"2010":{LOCAL:5.5,OUTSIDE:7},
"2118":{LOCAL:4,OUTSIDE:5.5}
};


const operatingCost={
BOLERO:{fastag:1.3,driver:600,localDep:3.6,outDep:2,maint:1,doc:53},
"1059":{fastag:1.3,driver:700,localDep:5.5,outDep:3.6,maint:1.1,doc:53},
"2059":{fastag:1.5,driver:700,localDep:6.4,outDep:4,maint:1.2,doc:81},
"2095":{fastag:1.5,driver:700,localDep:7.6,outDep:4,maint:1.4,doc:102},
"2010":{fastag:2.2,driver:700,localDep:8.4,outDep:5,maint:1.5,doc:140},
"2118":{fastag:2.5,driver:700,localDep:12,outDep:7,maint:2,doc:140}
};

function updateTruckData(){
const truck=document.getElementById("truckType").value;
const data=truckDatabase[truck];
document.getElementById("weight").value=data.weight;
const deck=document.getElementById("truckSize");
deck.innerHTML='';
data.decks.forEach(d=>{
const o=document.createElement("option");
o.value=d;
o.textContent=d+" FT";
deck.appendChild(o);
});
}


function toggleTheme() {
  const body = document.documentElement;
  const currentTheme = body.getAttribute("data-theme");
  const btn = document.getElementById("themeBtn");
  
  if (currentTheme === "dark") {
    body.removeAttribute("data-theme");
    btn.innerHTML = "🌙 Dark Mode";
  } else {
    body.setAttribute("data-theme", "dark");
    btn.innerHTML = "☀️ Light Mode";
  }
  calculate();
}

function money(v){
  return new Intl.NumberFormat('en-IN',{
    style:'currency',
    currency:'INR',
    maximumFractionDigits:0
  }).format(v);
}

function calculate(){
  const tripType = document.getElementById("tripType").value;
  const truckType=document.getElementById("truckType").value;
  const truckSize = +document.getElementById("truckSize").value;
  const km = Math.max(0, +document.getElementById("distance").value || 0);
  const wt = Math.max(0, +document.getElementById("weight").value || 0);
  const diesel = Math.max(0, +document.getElementById("dieselPrice").value || 0);
  const deliveries = Math.max(0, +document.getElementById("deliveries").value || 0);
  const returnLoad = document.getElementById("returnLoad").value;
  const timeType = document.getElementById("timeType").value;
  const timeValue = Math.max(0, +document.getElementById("timeValue").value || 0);

  let avg = fuelConsumption[truckType][tripType];

  let fuel = avg > 0 ? (km / avg) * diesel : 0;
  const costData=operatingCost[truckType];

let fastag = km * costData.fastag;
let maintenance = km * costData.maint;
let depreciationRate = tripType === "LOCAL" ? costData.localDep : costData.outDep;
let depreciation = km * depreciationRate;
let documentation = timeType === "DAY" ? timeValue * costData.doc : costData.doc;
let driver = timeType === "DAY" ? timeValue * costData.driver : costData.driver;

let permit = 0;
  if(tripType === "OUTSIDE" && document.getElementById("permitCheck").value === "YES"){
    permit = Math.max(0, +document.getElementById("permitCost").value || 0);
  }

  let actualCost = fuel + fastag + driver + documentation + depreciation + maintenance + permit;
  let margin = 0.30;
  let costBasedPrice = actualCost + (actualCost * margin);
  // No weight multiplier applied
let weightMultiplier = 1;

let originalSellingPrice = costBasedPrice;
  let deliveryIncome = deliveries * (tripType === "LOCAL" ? 200 : 300);
  let finalSellingPrice = originalSellingPrice + deliveryIncome;

  let truckMultiplier=1;
if(truckSize===20) truckMultiplier=1.10;
else if(truckSize===22) truckMultiplier=1.20;

finalSellingPrice *= truckMultiplier;

  let returnIncome = 0;
  let totalFreight = finalSellingPrice;
  if(returnLoad === "YES"){
    returnIncome = finalSellingPrice * 0.5;
    totalFreight = finalSellingPrice + returnIncome;
  }

  let profit = totalFreight - actualCost;
  let profitPercent = 30;

  let perKmCost = km > 0 ? actualCost / km : 0;
  let perKmRate = km > 0 ? totalFreight / km : 0;
  let perTon = wt > 0 ? totalFreight / wt : 0;

  // Cache data block state globally for Exporter use
  currentCalculatedData = {
    tripType,truckType, truckSize, km, wt, finalFreight: totalFreight, perKmRate, perTon, deliveries, returnLoad
  };

  document.getElementById("kpiCost").innerHTML = money(actualCost);
  document.getElementById("kpiFreight").innerHTML = money(totalFreight);
  document.getElementById("kpiProfit").innerHTML = money(profit);
  document.getElementById("kpiMargin").innerHTML = profitPercent.toFixed(1) + "%";
  document.getElementById("finalFreight").innerHTML = money(totalFreight);

  const profitKpi = document.getElementById("profitKpi");
  const marginKpi = document.getElementById("marginKpi");
  if(profit < 0) {
    profitKpi.className = marginKpi.className = "kpi red";
  } else {
    profitKpi.className = marginKpi.className = "kpi green";
  }

  document.getElementById("costBreakdown").innerHTML = `
    <div class="result-item"><span>⛽ Fuel Allocation Expense</span><b>${money(fuel)}</b></div>
    <div class="result-item"><span>🛣 FASTag Corridor Fee</span><b>${money(fastag)}</b></div>
    <div class="result-item"><span>👨‍✈️ Driver Compensation</span><b>${money(driver)}</b></div>
    <div class="result-item"><span>📄 Terminal Documentation</span><b>${money(documentation)}</b></div><div class="result-item"><span>🧰 Maintenance Cost</span><b>${money(maintenance)}</b></div>
    <div class="result-item"><span>🔧 Fleet Asset Depreciation</span><b>${money(depreciation)}</b></div>
    <div class="result-item"><span>📑 Statutory Permit Clearance</span><b>${money(permit)}</b></div>
    <div class="result-item"><span>⚖️ Target Fleet Efficiency</span><b>${avg} KM/L</b></div>
  `;

  document.getElementById("freightAnalysis").innerHTML = `
    <div class="result-item">
    <span>📦 Payload Weight</span>
    <b>${wt} TON</b>
</div>
    <div class="result-item"><span>🚚 Deck Footprint Multiplier</span><b>${truckMultiplier}x</b></div>
    <div class="result-item"><span>💰 Multi-Drop Ancillary Value</span><b>${money(deliveryIncome)}</b></div>
    <div class="result-item"><span>🔁 Backhaul Settlement Credit</span><b>${money(returnIncome)}</b></div>
    <div class="result-item"><span>📉 Operating Opex / KM</span><b>${money(perKmCost)}</b></div>
    <div class="result-item"><span>💵 gross Bill Rate / KM</span><b>${money(perKmRate)}</b></div>
    <div class="result-item"><span>🏋️‍♂️ Yield Unit / Ton</span><b>${money(perTon)}</b></div>
  `;

  const isDark = document.documentElement.getAttribute("data-theme") === "dark";
  const gridColor = isDark ? '#374151' : '#e2e8f0';
  const textColor = isDark ? '#9ca3af' : '#64748b';

  const ctx = document.getElementById("profitChart").getContext('2d');
  if(chart){ chart.destroy(); }

  chart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: ['Operating Expense', 'Gross Valuation', 'Net Retained Profit'],
      datasets: [{
        data: [actualCost, totalFreight, profit],
        backgroundColor: [ '#64748b', '#3b82f6', profit >= 0 ? '#10b981' : '#f43f5e' ],
        borderRadius: 8,
        barThickness: 32
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { display: false }, ticks: { color: textColor, font: { family: 'Plus Jakarta Sans' } } },
        y: { 
          grid: { color: gridColor }, 
          ticks: { 
            color: textColor,
            font: { family: 'Plus Jakarta Sans' },
            callback: function(val) { return '₹' + val.toLocaleString('en-IN'); } 
          } 
        }
      }
    }
  });
}

function exportToWhatsApp() {
  const d = currentCalculatedData;
  
  // Format dynamic quote parameters meticulously into clean text string
  const textMessage = 
`*AVADH FLEET SERVICE*
_Commercial Freight Quotation_

*Trip Configuration Details:*
---------------------------------------
• Trip Assignment Type : ${d.tripType}
• Truck Type : ${d.truckType}
• Truck Deck Size : ${d.truckSize} FT
• Route Logged Distance : ${d.km} KM
• Cargo Weight Loading : ${d.wt} TON
• Multi-Drop Deliveries : ${d.deliveries}
• Backhaul Backed Load  : ${d.returnLoad}

*Estimated Rate Summary:*
---------------------------------------
*💰 FINAL FREIGHT RATE : ${money(d.finalFreight)}*
• Effective Yield per KM: ${money(d.perKmRate)}/KM
• Effective Yield per Ton : ${money(d.perTon)}/TON

_Quotation calculated via Smart FMS Matrix Engine. Valid for 48 hours._`;

  const encodedURL = encodeURIComponent(textMessage);
  window.open(`https://api.whatsapp.com/send?text=${encodedURL}`, '_blank');
}

document.querySelectorAll("input, select").forEach(element => {
  element.addEventListener("input", calculate);
  element.addEventListener("change", calculate);
});

document.getElementById('truckType').addEventListener('change',()=>{updateTruckData();calculate();});
window.addEventListener('DOMContentLoaded',()=>{updateTruckData();calculate();});
</script>

</body>
</html>
